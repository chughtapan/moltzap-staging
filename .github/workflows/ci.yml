name: CI

on:
  push:
    branches: [main]
  pull_request:

# Optional self-hosted Nx remote cache for the ci, test and integration jobs:
# they read with NX_CACHE_TOKEN; main (nx-cache-write environment) and
# same-repository pull requests (NX_CACHE_WRITE_TOKEN) write. Forks and
# Dependabot run without it; NX_CACHE_DISABLED=true turns it off everywhere.

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: &nx-cache-environment ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nx-cache-write' || '' }}
    env: &nx-cache
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_CACHE_URL }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && secrets.NX_CACHE_WRITE_TOKEN || secrets.NX_CACHE_TOKEN }}
      NX_SKIP_REMOTE_CACHE: ${{ (vars.NX_CACHE_DISABLED == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.actor == 'dependabot[bot]') && 'true' || 'false' }}
    steps:
      # Depth 2 gives the CHANGELOG.md guard the merge commit's parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # The release commit writes CHANGELOG.md from the fragments in
      # changelog.d/, so a pull request adds a fragment instead of editing it.
      # HEAD is the pull request's merge commit, whose first parent is its
      # base.
      - name: Refuse CHANGELOG.md edits
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::This pull request edits CHANGELOG.md; add a fragment under changelog.d/ instead (see towncrier.toml)"
            exit 1
          fi
      - name: Render the changelog fragments
        if: github.event_name == 'pull_request'
        run: |
          python3 -m venv "$RUNNER_TEMP/towncrier"
          "$RUNNER_TEMP/towncrier/bin/pip" install --quiet --require-hashes --no-deps \
            -r scripts/release/towncrier-requirements.txt
          "$RUNNER_TEMP/towncrier/bin/towncrier" build --draft --version 0.0.0
      - uses: ./.github/actions/setup-toolchain

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Pack gates install the published closures in isolated consumers.
      # NanoClaw checks its Client ABI without packing the source-copied adapter.
      - name: Verify the published closure installs from tarballs
        run: pnpm nx run-many -t test:pack,test:abi --parallel=4
      - run: pnpm typecheck
      - run: pnpm nx run-many -t typecheck:tests
      - name: Lint
        run: pnpm lint
        timeout-minutes: 30
      - run: pnpm format:check
      - run: pnpm docs:api
      - run: pnpm docs:check
      - run: pnpm docs:check:mermaid
      - run: pnpm nx run-many -t test:release,test:image-input-key -p workspace

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: *nx-cache-environment
    env: *nx-cache
    steps:
      # Full history lets nx-set-shas find the pull request's comparison base.
      # Each test target builds its dependencies through Nx.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        if: github.event_name == 'pull_request'
      - name: Test the affected projects
        if: github.event_name == 'pull_request'
        run: pnpm exec nx affected -t test
      - name: Test every project
        if: github.event_name != 'pull_request'
        run: pnpm exec nx run-many -t test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: *nx-cache-environment
    env: *nx-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        if: github.event_name == 'pull_request'
      - name: Run affected process lanes
        if: github.event_name == 'pull_request'
        run: pnpm exec nx affected -t test:integration --parallel=4
      - name: Run every process lane
        if: github.event_name != 'pull_request'
        run: pnpm exec nx run-many -t test:integration --parallel=4

  published-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run @moltzap/integration-tests:test:published

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every image a release tags builds here before it merges. Tagged with
      # the published names so images/compose.yaml runs Registry and Router
      # with SHARNESS_NETWORK_VERSION=ci and pulls nothing.
      - name: Build release images for amd64
        run: |
          for service in registry router daemon openclaw-agent; do
            context=.
            if [[ "$service" == openclaw-agent ]]; then
              context=images/openclaw-agent
            fi
            docker buildx build --platform linux/amd64 --load \
              --file "images/${service}/Dockerfile" \
              --tag "ghcr.io/social-harness/${service}:ci" "$context"
          done
      - name: Smoke-test deployed executables
        run: |
          docker run --rm ghcr.io/social-harness/registry:ci --help
          docker run --rm ghcr.io/social-harness/router:ci --help
          docker run --rm --entrypoint pglite-server ghcr.io/social-harness/registry:ci --help
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm install --frozen-lockfile
      - name: Run the documented own-network path against these images
        env:
          SHARNESS_NETWORK_VERSION: ci
        run: pnpm nx run @moltzap/integration-tests:test:network
