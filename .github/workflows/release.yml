name: Release

# Releases a commit on main once its CI run passes: both npm packages and
# every image at one version, a `v<version>` tag, and a GitHub release whose
# notes come from the merged pull requests. docs/reference/spec/releases.md
# describes what a release contains.
#
# The version tag is created first. A run for a commit that already has one
# reuses its version and publishes only what is missing, so a failed release
# is finished by running the workflow again.
#
# Installed code never runs beside publishing credentials. `pack` installs and
# builds with no token. `npm` and `index` hold the publishing identities and
# install nothing. `image` builds inside Docker.
#
# Each npm package must trust this workflow in the `release` environment
# before its first publication. Notifying the deployment repository needs the
# release App: variable RELEASE_APP_CLIENT_ID and secret RELEASE_APP_PRIVATE_KEY.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PACKAGES: packages/social-harness plugins/openclaw
  IMAGES: registry router daemon openclaw-agent

jobs:
  version:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reuse this commit's version tag or claim the next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[] | "\(.object.sha) \(.ref | sub("^refs/tags/v"; ""))"')
          version=$(awk -v commit="$commit" '$1 == commit { print $2; exit }' <<<"$tags")
          if [ -z "$version" ]; then
            taken=$(awk '{ print $2 }' <<<"$tags" | tr '\n' ' ')
            # shellcheck disable=SC2086 # PACKAGES is a list of directories.
            version=$(TAKEN_VERSIONS="$taken" scripts/release/compute-next-version.sh $PACKAGES)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/v$version" -f sha="$commit" >/dev/null
          fi
          {
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  pack:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm install --frozen-lockfile
      - name: Pack every package at the release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for package in $PACKAGES; do
            (cd "$package" && npm pkg set version="$VERSION")
          done
          pnpm build
          mkdir "$RUNNER_TEMP/tarballs"
          for package in $PACKAGES; do
            (cd "$package" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error

  npm:
    needs: [version, pack]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      # The repository's Node version ships an npm that publishes with OIDC.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          sparse-checkout: .node-version
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
      # `pack` ran installed code, so each tarball is checked before it is
      # published: it carries the release version, and no `publishConfig`
      # that could send the publish somewhere else.
      - name: Publish each package not yet on npm at this version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for tarball in "$RUNNER_TEMP"/tarballs/*.tgz; do
            manifest=$(tar -xOzf "$tarball" package/package.json)
            name=$(jq -r .name <<<"$manifest")
            jq -e --arg version "$VERSION" \
              '.version == $version and (has("publishConfig") | not)' >/dev/null <<<"$manifest" || {
              echo "ERROR: $tarball is not $name@$VERSION, or carries a publishConfig" >&2
              exit 1
            }
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm"
              continue
            fi
            npm publish "$tarball" --access public --provenance --registry https://registry.npmjs.org/
          done

  image:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        service: [registry, router, daemon, openclaw-agent]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - name: Build and push this platform by digest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SERVICE: ${{ matrix.service }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          for package in $PACKAGES; do
            (cd "$package" && npm pkg set version="$VERSION")
          done
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use \
            --driver-opt image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          docker buildx build --platform "linux/$PLATFORM" \
            --file "images/$SERVICE/Dockerfile" \
            --output "type=image,name=ghcr.io/social-harness/$SERVICE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json" .
          jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json" > "$RUNNER_TEMP/$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.service }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/${{ matrix.platform }}
          if-no-files-found: error

  index:
    needs: [version, image]
    strategy:
      fail-fast: false
      matrix:
        service: [registry, router, daemon, openclaw-agent]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The index is signed by digest before any tag names it.
      - name: Sign the two-platform index and tag it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
          SERVICE: ${{ matrix.service }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/social-harness/$SERVICE"
          sources=("$image@$(cat "$RUNNER_TEMP/digests/amd64")" "$image@$(cat "$RUNNER_TEMP/digests/arm64")")
          docker buildx imagetools create --dry-run "${sources[@]}" > "$RUNNER_TEMP/index.json"
          ref="$image@sha256:$(sha256sum "$RUNNER_TEMP/index.json" | cut -d ' ' -f1)"
          docker buildx imagetools create --tag "$ref" "${sources[@]}"
          cosign sign --yes "$ref"
          docker buildx imagetools create --tag "$image:$VERSION" --tag "$image:sha-$COMMIT" "$ref"

  release:
    needs: [version, npm, index]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    outputs:
      payload: ${{ steps.release.outputs.payload }}
    steps:
      - name: Create the GitHub release and list its images
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          notes="$RUNNER_TEMP/notes.md"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes"
          payload=$(jq -cn --arg version "$VERSION" '{version: $version}')
          grep -qxF '### Images' "$notes" || printf '\n### Images\n' >> "$notes"
          for service in $IMAGES; do
            image="ghcr.io/social-harness/$service"
            ref="$image@$(docker buildx imagetools inspect "$image:$VERSION" --format '{{.Manifest.Digest}}')"
            # shellcheck disable=SC2016 # The backticks are Markdown.
            grep -qF "$ref" "$notes" || printf '\n- `%s`\n' "$ref" >> "$notes"
            payload=$(jq -c --arg service "$service" --arg ref "$ref" '. + {($service): $ref}' <<<"$payload")
          done
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

  notify:
    needs: release
    runs-on: ubuntu-24.04
    environment: release
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: social-harness
          repositories: deployment
          permission-contents: write
      - name: Tell the deployment repository which release to run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PAYLOAD: ${{ needs.release.outputs.payload }}
        run: |
          jq -n --argjson payload "$PAYLOAD" '{event_type: "social-harness-released", client_payload: $payload}' \
            | gh api --method POST repos/social-harness/deployment/dispatches --input -
