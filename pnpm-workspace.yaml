# The catalog holds the one version range of every npm dependency a workspace
# manifest declares; manifests say "catalog:". The overrides force one resolved
# version across the whole graph, except the undici one, which only raises
# undici 8 to a floor at its first security-patched release.
# tsc is TypeScript 7 (@typescript/native); "typescript" is the TypeScript 6 API, which typescript-eslint (<6.1.0) and other tools load.
packages:
  - "tests/*"
  - "images/daemon"

catalog:
  "@chughtapan/safer-architecture-lsp": 0.3.2
  "@effect/language-service": ^0.87.1
  "@effect/opentelemetry": 0.64.0
  "@effect/platform": 0.97.1
  "@effect/platform-node": ^0.108.0
  "@effect/sql": ^0.52.0
  "@effect/sql-pg": ^0.53.0
  "@effect/vitest": ^0.30.0
  "@eslint-community/eslint-plugin-eslint-comments": ^4.7.1
  "@modelcontextprotocol/client": https://pkg.pr.new/@modelcontextprotocol/client@5ebb589
  "@modelcontextprotocol/server": https://pkg.pr.new/@modelcontextprotocol/server@5ebb589
  "@opentelemetry/api": ^1.9.0
  "@opentelemetry/exporter-trace-otlp-proto": ^0.223.0
  "@opentelemetry/resources": ^2.12.0
  "@opentelemetry/sdk-logs": ^0.223.0
  "@opentelemetry/sdk-metrics": ^2.12.0
  "@opentelemetry/sdk-trace-base": ^2.12.0
  "@opentelemetry/sdk-trace-node": ^2.12.0
  "@opentelemetry/semantic-conventions": ^1.33.0
  "@types/node": ^25.5.0
  "@typescript/native": npm:typescript@7.0.2
  effect: ^3.22.0
  eslint: ^9
  eslint-plugin-agent-code-guard: 0.0.24
  husky: ^9.0.0
  jiti: ^2.7.0
  jose: 6.2.5
  mint: 4.2.749
  nx: ^22.7.5
  oxfmt: ^0.7.0
  typescript: npm:@typescript/typescript6@6.0.2
  vitest: 3.2.4

overrides:
  effect: 3.22.1
  "@chughtapan/safer-architecture-lsp>typescript": "catalog:"
  "eslint-plugin-sonarjs>typescript": "catalog:"
  "@typescript/typescript6>@typescript/old": "npm:typescript@6.0.3"
  "undici@>=8.0.0 <8.12.2": ^8.12.2
  "zod@>=4.0.0 <4.6.6": ^4.6.6
